<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dış daire (kırmızı) -->
  <circle cx="100" cy="100" r="95" fill="#EF5A6F" stroke="#FF0000" stroke-width="3"/>
  
  <!-- İç daire (beyaz) -->
  <circle cx="100" cy="100" r="85" fill="white"/>
  
  <!-- Müzik notu -->
  <g transform="translate(100, 100)">
    <!-- Birinci nota (sol taraf) -->
    <circle cx="-15" cy="20" r="12" fill="#EF5A6F"/>
    <rect x="-13" y="-25" width="4" height="45" fill="#EF5A6F" rx="2"/>
    
    <!-- İkinci nota (sağ taraf) -->
    <circle cx="15" cy="10" r="12" fill="#EF5A6F"/>
    <rect x="17" y="-35" width="4" height="45" fill="#EF5A6F" rx="2"/>
    
    <!-- Bağlantı çizgisi -->
    <path d="M -9 -25 Q 0 -30 19 -35" stroke="#EF5A6F" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
