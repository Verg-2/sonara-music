<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müzik Uygulaması</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">♪</div>
            </div>
            
            <div class="nav-icons">
                <div class="nav-item active" id="home-btn" data-tooltip="Ana sayfa">
                    <i class="fas fa-home"></i>
                </div>
                <div class="nav-item" id="library-btn" data-tooltip="Kütüphane">
                    <i class="fas fa-music"></i>
                </div>
                <div class="nav-item" id="users-btn" data-tooltip="Profilim">
                    <i class="fas fa-user"></i>
                </div>
                <div class="nav-item" id="theme-toggle-btn" data-tooltip="Tema">
                    <i class="fas fa-sun"></i>
                </div>
            </div>
            
            <div class="profile-section">
                <div class="profile-icon" data-tooltip="Profil">K</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Home View -->
            <section id="home-view" class="view">
                <div class="header">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Ara" id="search-input">
                    </div>
                    <div class="category-buttons">
                        <button class="category-btn active" data-category="odaklanma">Odaklanma</button>
                        <button class="category-btn" data-category="antreman">Antreman</button>
                        <button class="category-btn" data-category="parti">Parti</button>
                        <button class="category-btn" data-category="huzunlu">Hüzünlü</button>
                        <button class="category-btn" data-category="enerjik">Enerjik</button>
                    </div>
                </div>

                <!-- Artists Grid -->
                <div class="artists-grid" id="artists-grid">
                    <!-- Artists will be dynamically populated -->
                </div>
            </section>

            <!-- Library View -->
            <section id="library-view" class="view hidden" aria-hidden="true">
                <div class="header">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Ara Kütüphane" id="library-search">
                    </div>
                    <div class="category-buttons library-tabs">
                        <button class="category-btn active">Oynatma Listeleri</button>
                        <button class="category-btn">Şarkılar</button>
                        <button class="category-btn">Albümler</button>
                        <button class="category-btn">Sanatçılar</button>
                    </div>
                </div>

                <div class="library-grid">
                    <div class="library-card">
                        <div class="library-thumb gradient-1">
                            <i class="fas fa-thumbs-up"></i>
                        </div>
                        <div class="library-title">Beğendiğin Şarkılar</div>
                    </div>
                    <div class="library-card">
                        <div class="library-thumb gradient-2">
                            <i class="fas fa-compact-disc"></i>
                        </div>
                        <div class="library-title">Arabesk</div>
                    </div>
                    <div class="library-card">
                        <div class="library-thumb gradient-3">
                            <i class="fas fa-music"></i>
                        </div>
                        <div class="library-title">Rap</div>
                    </div>
                    <div class="library-card">
                        <div class="library-thumb gradient-4">
                            <i class="fas fa-headphones"></i>
                        </div>
                        <div class="library-title">Pop</div>
                    </div>
                    <div class="library-card">
                        <div class="library-thumb gradient-5">
                            <i class="fas fa-random"></i>
                        </div>
                        <div class="library-title">Karışık</div>
                    </div>
                    <div class="library-card">
                        <div class="library-thumb gradient-6">
                            <i class="fas fa-bookmark"></i>
                        </div>
                        <div class="library-title">Daha sonra dinlemek</div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Context Menu -->
        <div class="context-menu" id="context-menu">
            <div class="menu-item" id="play-radio">
                <i class="fas fa-radio"></i>
                <span>Radyoyu başlat</span>
            </div>
            <div class="menu-item" id="play-after">
                <i class="fas fa-play"></i>
                <span>Bundan sonra oynat</span>
            </div>
            <div class="menu-item" id="add-queue">
                <i class="fas fa-list"></i>
                <span>Sıraya ekle</span>
            </div>
            <div class="menu-item" id="like-song">
                <i class="fas fa-heart"></i>
                <span>Beğenilen şarkılara ekle</span>
            </div>
            <div class="menu-item" id="download">
                <i class="fas fa-download"></i>
                <span>İndir</span>
            </div>
            <div class="menu-item" id="add-playlist">
                <i class="fas fa-plus"></i>
                <span>Oynatma listesine ekle</span>
            </div>
            <div class="menu-item" id="delete">
                <i class="fas fa-trash"></i>
                <span>Sil</span>
            </div>
            <div class="menu-item" id="go-album">
                <i class="fas fa-compact-disc"></i>
                <span>Albüme git</span>
            </div>
            <div class="menu-item" id="go-artist">
                <i class="fas fa-user"></i>
                <span>Sanatçıya git</span>
            </div>
            <div class="menu-item" id="share">
                <i class="fas fa-share"></i>
                <span>Paylaş</span>
            </div>
            <div class="menu-item" id="report">
                <i class="fas fa-flag"></i>
                <span>Bildir</span>
            </div>
            <div class="menu-item" id="add-favorites">
                <i class="fas fa-star"></i>
                <span>Sabitle</span>
            </div>
            <div class="menu-item" id="close-queue">
                <i class="fas fa-times"></i>
                <span>Sırayı kapat</span>
            </div>
        </div>

        <!-- Player -->
        <div class="player">
            <div class="player-controls">
                <button class="control-btn" id="prev-btn">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-pause" id="play-pause-btn">
                    <i class="fas fa-pause"></i>
                </button>
                <button class="control-btn" id="next-btn">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
            
            <div class="current-song">
                <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 50 50'%3E%3Crect width='100%25' height='100%25' fill='%23333'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%23fff' font-family='Arial' font-size='18'%3E%E2%99%AA%3C/text%3E%3C/svg%3E" alt="Current Song" id="current-cover">
                <div class="song-info">
                    <div class="song-title" id="current-title">Hasta İşi</div>
                    <div class="song-artist" id="current-artist">Yener Çevik Hasta İşi 2017</div>
                </div>
            </div>
            
            <div class="player-options">
                <button class="option-btn" id="queue-btn">
                    <i class="fas fa-list"></i>
                </button>
                <button class="option-btn" id="favorite-btn">
                    <i class="fas fa-heart"></i>
                </button>
                <button class="option-btn" id="shuffle-btn">
                    <i class="fas fa-random"></i>
                </button>
                <button class="option-btn" id="repeat-btn">
                    <i class="fas fa-redo"></i>
                </button>
                <button class="option-btn" id="volume-btn">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
