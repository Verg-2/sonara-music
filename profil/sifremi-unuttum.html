<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="profil.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="profile-page">
    <div class="profile-container">
        <div class="brand-mark">
            <div class="brand-circle">
                <i class="fas fa-key"></i>
            </div>
            <div class="brand-title">Şifremi Unuttum</div>
        </div>

        <p class="reset-description">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>

        <form class="login-form">
            <label class="input-label" for="email">E-Posta</label>
            <input id="email" type="email" placeholder="E-Posta Giriniz" autocomplete="email" required>

            <button type="submit" class="primary-btn">Sıfırlama Bağlantısı Gönder</button>
        </form>

        <div class="signup-row">
            <span>Hatırladınız mı?</span>
            <a href="profil.html" class="link">Giriş Yap</a>
        </div>
    </div>

    <script src="sifremi-unuttum.js"></script>
</body>
</html>
