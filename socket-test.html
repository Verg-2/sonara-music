<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonara - Gerçek Zamanlı Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.9em;
        }

        .status.connected {
            background: #4caf50;
        }

        .status.disconnected {
            background: #f44336;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, button, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .online-count {
            font-size: 2em;
            color: #4caf50;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            background: #f0f7f4;
            border-radius: 8px;
        }

        .event-log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
        }

        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            word-break: break-all;
        }

        .log-entry.success {
            color: #4caf50;
        }

        .log-entry.warning {
            color: #ff9800;
        }

        .log-entry.error {
            color: #f44336;
        }

        .log-entry.info {
            color: #2196f3;
        }

        .notification {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            animation: slideIn 0.3s ease;
        }

        .notification.success {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .notification.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .user-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .user-info p {
            margin: 5px 0;
            color: #333;
        }

        .user-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Sonara Real-time Socket.io Test</h1>
            <div class="status disconnected" id="statusBadge">● Bağlantı Kesilmiş</div>
        </div>

        <div class="grid">
            <!-- User Login Card -->
            <div class="card">
                <h2>👤 Kullanıcı Girişi</h2>
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="username" placeholder="Adınız" value="Kullanıcı 1">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="email@example.com" value="user1@example.com">
                </div>
                <button onclick="joinUser()">Bağlan</button>

                <div class="user-info" style="margin-top: 20px; display: none;" id="userInfo">
                    <p><strong>Socket ID:</strong> <span id="socketId">-</span></p>
                    <p><strong>Kullanıcı:</strong> <span id="displayName">-</span></p>
                    <p><strong>Durum:</strong> <span id="userStatus">●</span></p>
                </div>
            </div>

            <!-- Online Count Card -->
            <div class="card">
                <h2>👥 Online Kullanıcılar</h2>
                <div class="online-count" id="onlineCount">0</div>
                <button onclick="socket.getOnlineCount()" style="margin-top: 10px;">Yenile</button>
            </div>

            <!-- Music Playback Card -->
            <div class="card">
                <h2>🎵 Şarkı Oynatma</h2>
                <div class="form-group">
                    <label>Şarkı Adı</label>
                    <input type="text" id="songTitle" placeholder="Şarkı adı" value="Açlık">
                </div>
                <div class="form-group">
                    <label>Sanatçı</label>
                    <input type="text" id="songArtist" placeholder="Sanatçı adı" value="Sürüceydiz">
                </div>
                <div class="form-group">
                    <label>Süre (saniye)</label>
                    <input type="number" id="songDuration" placeholder="200" value="240">
                </div>
                <div class="button-group">
                    <button onclick="playSong()">▶️ Çal</button>
                    <button onclick="pauseSong()">⏸ Duraklat</button>
                </div>
                <button onclick="endSong()" style="margin-top: 10px;">⏹ Bitir</button>
            </div>

            <!-- Likes Card -->
            <div class="card">
                <h2>❤️ Beğeni</h2>
                <div class="form-group">
                    <label>Şarkı ID</label>
                    <input type="text" id="likesSongId" placeholder="Şarkı ID" value="song123">
                </div>
                <button onclick="likeSong()">❤️ Beğen</button>
                <button onclick="unlikeSong()" style="margin-top: 10px;">🤍 Beğeni Kaldır</button>
            </div>

            <!-- Notifications Card -->
            <div class="card">
                <h2>📢 Bildirim Gönder</h2>
                <div class="form-group">
                    <label>Bildirim Türü</label>
                    <select id="notificationType">
                        <option value="info">ℹ️ Bilgi</option>
                        <option value="like">❤️ Beğeni</option>
                        <option value="follow">👥 Takip</option>
                        <option value="comment">💬 Yorum</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Başlık</label>
                    <input type="text" id="notificationTitle" placeholder="Bildirim başlığı" value="Yeni Beğeni">
                </div>
                <div class="form-group">
                    <label>Mesaj</label>
                    <input type="text" id="notificationMsg" placeholder="Bildirim mesajı" value="Şarkını biri beğendi!">
                </div>
                <button onclick="sendNotification()">Gönder</button>
            </div>

            <!-- Search Card -->
            <div class="card">
                <h2>🔍 Canlı Arama</h2>
                <div class="form-group">
                    <label>Arama Terimi</label>
                    <input type="text" id="searchQuery" placeholder="Arana..." value="metallica">
                </div>
                <button onclick="liveSearch()">Ara</button>
            </div>
        </div>

        <!-- Event Log -->
        <div class="card">
            <h2>📊 Event Log</h2>
            <button onclick="clearLog()" style="margin-bottom: 10px;">Temizle</button>
            <div class="event-log" id="eventLog">
                <div class="log-entry info">🚀 Sayfa yüklendi</div>
            </div>
        </div>

        <!-- Notifications Container -->
        <div id="notificationContainer" style="position: fixed; bottom: 20px; right: 20px; width: 300px;"></div>
    </div>

    <!-- Socket.io Library -->
    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <!-- Socket Client -->
    <script src="./socket-client.js"></script>

    <script>
        let socket;

        // Initialize socket on page load
        window.addEventListener('load', async () => {
            try {
                socket = new SocketClient('http://localhost:5000');
                await socket.connect();
                socket.setupCommonListeners();

                updateStatus(true);
                addLog('✅ Socket sunucuya bağlandı', 'success');
            } catch (error) {
                updateStatus(false);
                addLog('❌ Socket bağlantı hatası: ' + error.message, 'error');
            }
        });

        // User Join
        function joinUser() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!username) {
                addLog('❌ Kullanıcı adı gerekli', 'error');
                return;
            }

            socket.joinUser({
                userId: 'user_' + Math.random().toString(36).substr(2, 9),
                username,
                email,
                avatar: 'https://i.pravatar.cc/150?u=' + username
            });

            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('socketId').textContent = socket.getId();
            document.getElementById('displayName').textContent = username;
            document.getElementById('userStatus').textContent = '● Çevrimiçi';
            document.getElementById('userStatus').style.color = '#4caf50';

            addLog(`👤 ${username} bağlandı`, 'success');
        }

        // Music Functions
        function playSong() {
            const title = document.getElementById('songTitle').value;
            const artist = document.getElementById('songArtist').value;
            const duration = parseInt(document.getElementById('songDuration').value) || 0;

            if (!title || !artist) {
                addLog('❌ Şarkı adı ve sanatçı gerekli', 'error');
                return;
            }

            socket.playSong({
                id: 'song_' + Date.now(),
                title,
                artist,
                duration
            });

            addLog(`▶️ Şarkı çalındı: ${title} - ${artist}`, 'info');
        }

        function pauseSong() {
            const songId = 'song_' + Date.now();
            socket.pauseSong(songId, 120);
            addLog('⏸ Şarkı duraklatıldı', 'info');
        }

        function endSong() {
            const songId = 'song_' + Date.now();
            socket.endSong(songId, 240);
            addLog('⏹ Şarkı bitti', 'info');
        }

        // Like Functions
        function likeSong() {
            const songId = document.getElementById('likesSongId').value;
            if (!songId) {
                addLog('❌ Şarkı ID gerekli', 'error');
                return;
            }
            socket.likeSong(songId, 'Şarkı');
        }

        function unlikeSong() {
            const songId = document.getElementById('likesSongId').value;
            if (!songId) {
                addLog('❌ Şarkı ID gerekli', 'error');
                return;
            }
            socket.unlikeSong(songId);
            addLog('🤍 Beğeni kaldırıldı', 'info');
        }

        // Notification
        function sendNotification() {
            const type = document.getElementById('notificationType').value;
            const title = document.getElementById('notificationTitle').value;
            const message = document.getElementById('notificationMsg').value;

            if (!title || !message) {
                addLog('❌ Başlık ve mesaj gerekli', 'error');
                return;
            }

            socket.sendNotification({ type, title, message });
            addLog(`📢 Bildirim gönderildi: ${title}`, 'success');
        }

        // Search
        function liveSearch() {
            const query = document.getElementById('searchQuery').value;
            if (!query) {
                addLog('❌ Arama terimi gerekli', 'error');
                return;
            }
            socket.liveSearch(query);
            addLog(`🔍 Arama yapılıyor: ${query}`, 'info');
        }

        // UI Utilities
        function updateStatus(connected) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = connected ? '● Bağlı' : '● Bağlantı Kesilmiş';
            badge.className = 'status ' + (connected ? 'connected' : 'disconnected');
        }

        function addLog(message, type = 'info') {
            const log = document.getElementById('eventLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;

            if (log.children.length > 100) {
                log.removeChild(log.firstChild);
            }
        }

        function clearLog() {
            document.getElementById('eventLog').innerHTML = '';
            addLog('📋 Log temizlendi', 'info');
        }

        // Listen to custom events
        document.addEventListener('socket:onlineUsersUpdate', (e) => {
            document.getElementById('onlineCount').textContent = e.detail.count;
            addLog(`👥 Online: ${e.detail.count}`, 'info');
        });

        document.addEventListener('socket:notificationReceived', (e) => {
            addLog(`📢 Bildirim: ${e.detail.title}`, 'success');
            showNotification(e.detail.title, e.detail.message, e.detail.type);
        });

        document.addEventListener('socket:songLiked', (e) => {
            addLog(`❤️ ${e.detail.username} şarkıyı beğendi`, 'success');
        });

        function showNotification(title, message, type = 'info') {
            const container = document.getElementById('notificationContainer');
            const notif = document.createElement('div');
            notif.className = 'notification ' + type;
            notif.innerHTML = `<strong>${title}</strong><p>${message}</p>`;
            container.appendChild(notif);

            setTimeout(() => notif.remove(), 4000);
        }
    </script>
</body>
</html>
